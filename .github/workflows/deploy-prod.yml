name: Deploy → Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: devert-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: devert-frontend

      - name: Build
        run: npm run build
        working-directory: devert-frontend

      - name: Deploy to Firebase Hosting (live)
        run: npx firebase-tools deploy --only hosting --project devert-me
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore rules + indexes (Placements Prep)
        run: npx firebase-tools deploy --only firestore --project devert-me
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
