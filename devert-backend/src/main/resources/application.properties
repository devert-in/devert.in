spring.application.name=devert-backend
server.port=8080

# CORS - comma-separated origin patterns (supports * wildcards, e.g. for Firebase
# Hosting preview channels). Override via ALLOWED_ORIGINS in prod if the domain set
# ever changes; no redeploy needed.
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://devert.in,https://www.devert.in,https://devert-me.web.app,https://devert-me.firebaseapp.com,https://devert-me--*.web.app,http://localhost:3000}

# Actuator - health only, for Cloud Run's health checks. Not the full management
# surface (no env/beans/etc exposed over HTTP).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CodeLab - OnlineCompiler.io (replaced Judge0 CE/RapidAPI for a far higher free quota -
# see CodeExecutionService's class comment for the error-fidelity tradeoff that came
# with it). Key comes from onlinecompiler.io's dashboard after creating an app.
onlinecompiler.api.key=${ONLINECOMPILER_API_KEY:}

# CodeLab - Firebase service account for server-side Firestore access (hidden test
# cases, graded submissions). Paste the service-account.json content (or its base64
# encoding) as the Cloud Run env var FIREBASE_SERVICE_ACCOUNT_JSON.
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Admin account setup/reset emails (AdminAccountService) point their password
# link at our own branded page instead of Firebase Hosting's default
# <project>.firebaseapp.com/__/auth/action - see that page's own comment.
app.frontend.password-reset-url=${PASSWORD_RESET_URL:https://devert.in/reset-password}
