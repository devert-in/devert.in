spring.application.name=devert-backend
server.port=8080

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CodeLab - Judge0 CE (hosted on RapidAPI in Phase 1; self-hosting is a documented
# future option). Verify judge0.api.host matches whichever Judge0 CE listing you
# subscribe to on RapidAPI - "judge0-ce.p.rapidapi.com" is the common default.
judge0.api.url=${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
judge0.api.key=${JUDGE0_API_KEY:}
judge0.api.host=${JUDGE0_API_HOST:judge0-ce.p.rapidapi.com}

# CodeLab - Firebase service account for server-side Firestore access (hidden test
# cases, graded submissions). Paste the service-account.json content (or its base64
# encoding) as the Render env var FIREBASE_SERVICE_ACCOUNT_JSON.
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
